name: Mirror to Azure DevOps

# Espelho completo (com historico) do repositorio no Azure DevOps.
# Nome no ADO segue o padrao: ATS.Central.<nome-do-repo-no-github>
#
# Atencao: --prune replica remocoes. Branch ou tag que deixe de existir no
# GitHub e apagada no ADO. Ninguem deve commitar no lado do Azure DevOps.

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-azure
  cancel-in-progress: false

env:
  AZ_ORG: ats-informatica
  AZ_PROJECT: Central
  AZ_PREFIX: ATS.Central.

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Azure DevOps repository exists
        env:
          AZ_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${AZ_PAT}" ]; then
            echo "::error::secret AZURE_DEVOPS_PAT nao configurado neste repositorio"
            exit 1
          fi
          az_repo="${AZ_PREFIX}${GITHUB_REPOSITORY##*/}"
          echo "AZ_REPO=${az_repo}" >> "${GITHUB_ENV}"

          auth=$(printf ':%s' "${AZ_PAT}" | base64 -w0)
          base="https://dev.azure.com/${AZ_ORG}/${AZ_PROJECT}/_apis/git/repositories"

          code=$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -H "Authorization: Basic ${auth}" \
            "${base}/${az_repo}?api-version=7.1")

          if [ "${code}" = "200" ]; then
            echo "repo '${az_repo}' ja existe em ${AZ_PROJECT}"
          elif [ "${code}" = "404" ]; then
            echo "criando repo '${az_repo}' em ${AZ_PROJECT}"
            ccode=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST \
              -H "Authorization: Basic ${auth}" \
              -H 'Content-Type: application/json' \
              -d "{\"name\":\"${az_repo}\"}" \
              "${base}?api-version=7.1")
            if [ "${ccode}" != "201" ] && [ "${ccode}" != "200" ]; then
              echo "::error::falha ao criar repo (HTTP ${ccode})"
              sed -e 's/[A-Za-z0-9]\{40,\}/***/g' /tmp/post.json || true
              exit 1
            fi
          else
            echo "::error::resposta inesperada da API do Azure DevOps (HTTP ${code}) - PAT invalido/expirado, ou sem permissao no projeto"
            exit 1
          fi

      - name: Push to Azure DevOps
        env:
          AZ_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          set -euo pipefail
          git remote add azure \
            "https://x-access-token:${AZ_PAT}@dev.azure.com/${AZ_ORG}/${AZ_PROJECT}/_git/${AZ_REPO}"
          git push azure --prune --all
          git push azure --prune --tags
          echo "espelhado em ${AZ_PROJECT}/${AZ_REPO}"
