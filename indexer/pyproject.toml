[project]
name = "erp-kb-indexer"
version = "0.1.0"
description = "Service to index Markdown wiki files into FalkorDB"
authors = [{ name = "ATS Informatica", email = "suporte@atsinformatica.com.br" }]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "falkordb>=0.1.1",
    "google-genai>=1.0.0",
    "python-frontmatter>=1.0.0",
    "markdown-it-py>=3.0.0",
    "GitPython>=3.1.40",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=1.21.0",
    "structlog>=23.2.0",
    "pyyaml>=6.0.1",
]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
